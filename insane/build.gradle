plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'

def insane_mod_id = 'insaneae2addons'
def insane_group = 'net.oktawia.insaneae2addons'

version = mod_version
group = insane_group

base {
    archivesName = insane_mod_id
}
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${insane_mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            mods {
                "crazyae2addons" {
                    source project(':').sourceSets.main
                }
            }
        }

        server {
            args '--nogui'
            mods {
                "crazyae2addons" {
                    source project(':').sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run-data')
            mods {
                "crazyae2addons" {
                    source project(':').sourceSets.main
                }
            }
            args '--mod', insane_mod_id, '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/'),
                    '--existing-mod', 'crazyae2addons'
        }
    }
    mixin {
        add sourceSets.main, "mixins.insaneae2addons.json"
        defaultObfuscationEnv 'searge'
    }
}

sourceSets {
    main {
        ext.refMap = "mixins.insaneae2addons.refmap.json"
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources', 'src/generated/resources']
        }
    }
}

mixin {
    add sourceSets.main, "mixins.insaneae2addons.refmap.json"
    config "mixins.insaneae2addons.json"
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name "Modmaven"
        url "https://modmaven.dev/"
        content {
            includeGroup 'appeng'
            includeGroup 'de.mari_023'
        }
    }
    maven {
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com'
        content {
            includeGroup 'com.gregtechceu.gtceu'
            includeGroup 'appeng'
        }
    }
    maven {
        name = "Progwml6 maven"
        url = "https://dvs1.progwml6.com/files/maven/"
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        url 'https://www.cursemaven.com'
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        url "https://maven.shadowsoffire.dev/releases"
        content {
            includeGroup "dev.shadowsoffire"
        }
    }
    maven {
        name = "firstdarkdev"
        url = "https://maven.firstdarkdev.xyz/snapshots"
        content {
            includeGroup 'com.lowdragmc.ldlib'
        }
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
}

